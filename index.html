<!DOCTYPE html>
<html>
<head>
    <title>Counter App</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: linear-gradient(to right, #fde68a, #fca5a5);
            margin-top: 100px;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 30px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
        }

        .increase {
            background-color: #4CAF50;
            color: white;
        }

        .decrease {
            background-color: #ef4444;
            color: white;
        }

        .reset {
            background-color: #3b82f6;
            color: white;
        }
    </style>
</head>

<body>

<h1 id="count">0</h1>

<button class="increase" onclick="increase()">Increase</button>
<button class="decrease" onclick="decrease()">Decrease</button>
<button class="reset" onclick="reset()">Reset</button>

<script>
let count = 0;

function increase() {
    count++;
    document.getElementById("count").innerText = count;
}

function decrease() {
    count--;
    document.getElementById("count").innerText = count;
}

function reset() {
    count = 0;
    document.getElementById("count").innerText = count;
}
</script>

</body>
</html>
